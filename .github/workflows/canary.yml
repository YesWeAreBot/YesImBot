name: "Canary Release"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The npm dist-tag for this canary release (e.g., "canary", "test")'
        required: true
        default: "canary"
      reason:
        description: "Reason for this manual release"
        required: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-canary:
    name: Publish Canary Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # yarn.lock 不在仓库里（.gitignore 忽略），无法用 --immutable
      - name: Install Dependencies
        run: yarn install --no-immutable

      # 发布物里的 dist（控制台前端）由这一步产出
      - name: Build All Packages
        run: yarn build

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Canary Version
        run: yarn changeset version --snapshot ${{ github.event.inputs.tag }}

      # - name: Optimize Canary Version Format
      #   run: bun run optimize-canary-version

      - name: Publish to NPM
        run: yarn changeset publish --tag ${{ github.event.inputs.tag }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
