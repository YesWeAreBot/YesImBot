name: "Canary Release"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The npm dist-tag for this canary release (e.g., "canary", "test")'
        required: true
        default: "canary"
      reason:
        description: "Reason for this manual release"
        required: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-canary:
    name: Publish Canary Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build All Packages
        run: yarn build

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Canary Version
        run: yarn changeset version --snapshot "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Publish to NPM
        run: yarn changeset publish --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
