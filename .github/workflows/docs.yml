name: Generate and Deploy TS API Docs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to generate docs from"
        required: true
        default: "dev"

jobs:
  generate-and-deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # yarn.lock 不在仓库里（.gitignore 忽略），无法用 --immutable
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Generate API documentation
        run: yarn typedoc
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy generated API documentation [skip ci]"
